<div id="register-patient" class="tab-content">
    <div class="card-header">
        <div class="card-title">
            <i class="fa-solid fa-user-plus"></i> Register New Patient
        </div>
    </div>

    <form id="add-patient" onsubmit="event.preventDefault(); submitPatient();" style="margin-bottom: 30px;">
        <div class="form-grid" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px;">
            <div class="form-group">
                <label>Patient Full Name *</label>
                <input type="text" id="patientRegName" placeholder="Enter Full Name" required>
            </div>
            <div class="form-group">
                <label>Resident Address</label>
                <input type="text" id="patientRegAddress" placeholder="Enter Resident Address">
            </div>
            <div class="form-group">
                <label>Contact Phone Number (10 Digits) *</label>
                <input type="text" id="patientRegContact" placeholder="0771234567" required>
            </div>
        </div>
        <button type="submit" class="btn-submit" style="margin-top: 15px;">
            <i class="fa-solid fa-user-check"></i> Register Patient
        </button>
    </form>

    <div class="card-header">
        <div class="card-title">
            <i class="fa-solid fa-users"></i> Registered Patients List
        </div>
    </div>
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Patient ID</th>
                    <th>Patient Name</th>
                    <th>Address</th>
                    <th>Contact</th>
                </tr>
            </thead>
            <tbody id="patientTableBody">
                <tr><td colspan="4" style="text-align:center;">Loading patients...</td></tr>
            </tbody>
        </table>
    </div>
</div>
