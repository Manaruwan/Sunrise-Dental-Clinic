<div id="add-appointment" class="tab-content">
    <h3 style="margin-bottom: 22px; color: var(--secondary); font-size: 18px; font-weight: 800;">
        <i class="fa-solid fa-calendar-plus" style="color:var(--primary); margin-right:6px;"></i> Register Patient Appointment
    </h3>

    <form onsubmit="handleAppointmentSubmit(event)">
        <div class="form-grid">
            <div class="form-group">
                <label>Patient Full Name</label>
                <input type="text" id="patName" placeholder="Enter Full Name" required>
            </div>

            <div class="form-group">
                <label>Address</label>
                <input type="text" id="patAddress" placeholder="Enter Resident Address" required>
            </div>

            <div class="form-group">
                <label>Contact Phone Number (10 Digits)</label>
                <input type="text" id="patContact" placeholder="0771234567" pattern="\d{10}" required>
            </div>

            <div class="form-group">
                <label>Assigned Dentist</label>
                <select id="dentistDropdown" required>
                    <option value="">Loading Doctors...</option>
                </select>
            </div>

            <div class="form-group">
                <label>Treatment Type</label>
                <select id="treatmentDropdown" required>
                    <option value="">Loading Treatments...</option>
                </select>
            </div>

            <div class="form-group">
                <label>Appointment Schedule Date & Time</label>
                <input type="datetime-local" id="apptDateTime" required>
            </div>
        </div>

        <button type="submit" class="btn-submit">
            <i class="fa-solid fa-calendar-check"></i> Save & Confirm Appointment
        </button>
    </form>
</div>
