<div class="tab-content" id="new-appointment">
    <div class="card">
        
        <!-- Card Header -->
        <div class="card-header">
            <h3>
                <i class="fa-solid fa-calendar-plus" style="color: var(--primary);"></i> Register Patient Appointment
            </h3>
            <span class="badge badge-done" style="font-size: 12px;">
                <i class="fa-solid fa-clock"></i> Live Scheduling
            </span>
        </div>

        <form onsubmit="submitAppointment(event)">
            
            <!-- Quick Patient Auto-Fill Selector -->
            <div style="background: #f8fafc; border: 1.5px solid var(--border); border-radius: var(--radius-md); padding: 18px 20px; margin-bottom: 24px;">
                <div class="input-group">
                    <label style="font-size: 13.5px; font-weight: 800; color: var(--secondary); display: flex; align-items: center; gap: 8px;">
                        <i class="fa-solid fa-user-check" style="color: var(--primary);"></i> Select Registered Patient (Auto-Fills Details):
                    </label>
                    <select id="patientSelectDropdown" onchange="onPatientSelected(this.value)" style="margin-top: 4px; font-weight: 600; background: #ffffff;">
                        <option value="">-- Choose Existing Patient --</option>
                    </select>
                </div>
            </div>

            <input type="hidden" id="selectedPatientId" name="patientId">

            <!-- Appointment Form Grid (මෙමගින් Inputs ලස්සනට පෙළගස්වයි) -->
            <div class="form-grid">
                
                <div class="input-group">
                    <label>Patient Full Name *</label>
                    <input type="text" id="apptPatientName" placeholder="Enter Full Name" required>
                </div>

                <div class="input-group">
                    <label>Address</label>
                    <input type="text" id="apptAddress" placeholder="Enter Resident Address">
                </div>

                <div class="input-group">
                    <label>Contact Phone Number (10 Digits) *</label>
                    <input type="tel" id="apptContact" placeholder="0771234567" pattern="[0-9]{10}" required>
                </div>

                <div class="input-group">
                    <label>Treatment Type *</label>
                    <select id="treatmentDropdown" onchange="filterDoctorsByTreatment(this.value)" required>
                        <option value="">-- Select Treatment --</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Assigned Dentist *</label>
                    <select id="dentistDropdown" onchange="onDoctorScheduleSelect(this.value)" required>
                        <option value="">-- Select Dentist --</option>
                    </select>
                    <!-- Doctor Live Schedule Display Card -->
                    <div id="doctorAvailabilityBadge" style="display: none; margin-top: 8px; padding: 8px 12px; background: #e0f2fe; border: 1px solid #bae6fd; border-radius: 8px; font-size: 12px; color: #0369a1; font-weight: 700;">
                        <i class="fa-solid fa-business-time"></i> <span id="docAvailText">Schedule: Mon - Sat (09:00 AM - 05:00 PM)</span>
                    </div>
                </div>

                <div class="input-group">
                    <label>Appointment Schedule Date & Time *</label>
                    <input type="datetime-local" id="apptDateTime" required>
                </div>

            </div>

            <!-- Submit Action -->
            <div style="display: flex; justify-content: flex-start; margin-top: 15px;">
                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-calendar-check"></i> Save & Confirm Appointment
                </button>
            </div>

        </form>

    </div>
</div>
